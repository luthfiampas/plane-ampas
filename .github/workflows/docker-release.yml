name: Docker Release

on:
  push:
    branches:
      - ampas
  workflow_dispatch:

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: frontend
            file: apps/web/Dockerfile.web
            context: .
          - name: backend
            file: apps/api/Dockerfile.api
            context: apps/api
          - name: space
            file: apps/space/Dockerfile.space
            context: .
          - name: admin
            file: apps/admin/Dockerfile.admin
            context: .
          - name: live
            file: apps/live/Dockerfile.live
            context: .
          - name: proxy
            file: apps/proxy/Dockerfile.ce
            context: apps/proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read version
        id: version
        run: echo "VERSION=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/plane-${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}-plane-ampas-{{ date 'YYYYMMDD' }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
