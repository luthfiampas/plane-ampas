name: Docker Release

on:
  push:
    branches:
      - ampas

env:
  REGISTRY: docker.io
  IMAGE_OWNER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    strategy:
      matrix:
        image:
          - name: frontend
            file: apps/web/Dockerfile.web
            context: .
          - name: backend
            file: apps/api/Dockerfile.api
            context: apps/api
          - name: space
            file: apps/space/Dockerfile.space
            context: .
          - name: admin
            file: apps/admin/Dockerfile.admin
            context: .
          - name: live
            file: apps/live/Dockerfile.live
            context: .
          - name: proxy
            file: apps/proxy/Dockerfile.ce
            context: apps/proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute version tag
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          DATE=$(date +%Y%m%d)
          echo "TAG=${VERSION}-plane-ampas-${DATE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/plane-${{ matrix.image.name }}:${{ steps.version.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/plane-${{ matrix.image.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
